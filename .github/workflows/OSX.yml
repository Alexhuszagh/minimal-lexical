name: OSX

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  cross:
    name: Rust ${{matrix.target}}
    runs-on: macos-latest
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Run Check
        run: |
          cargo check
      - name: Run Simple Test
        run: |
          cargo test
      - name: Run Simple Test
        run: |
          cargo test --features=compact
